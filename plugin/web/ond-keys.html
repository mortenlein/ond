     Ond's web page, its own part (tools/build_web.sh puts it into DPF's page): the FM-1's keys under the screen
     (27 keys, F3..G5, as the FM-1's, with its OCT - / OCT +), PADS (Brudd's 16 breakers above the keys, held: break
     while playing), and the page fitted to the screen: on a phone the browser lays the page out wide
     enough for the screen and the keys (the viewport), so touches and the drawing stay in one scale. -->
<style>
  :root { --kb: 180px; --ks: 180px; }
  #canvas_wrapper { bottom: var(--kb) !important; }
  #ond-keys { position: fixed; left: 0; right: 0; bottom: 0; height: var(--kb); display: flex; gap: 8px;
    padding: 8px 10px 10px; box-sizing: border-box; background: #111; touch-action: none; user-select: none;
    -webkit-user-select: none; font: max(13px, calc(var(--ks) * 0.085)) ui-monospace, Menlo, Consolas, monospace; color: #9a958c; z-index: 1; }
  #ond-ctl { display: flex; flex-direction: column; gap: 6px; width: max(132px, calc(var(--ks) * 0.9)); flex: none; }
  #ond-ctl .row { display: flex; gap: 6px; flex: 1; }
  #ond-ctl button { flex: 1; font: inherit; color: #d8d3c8; background: #26241f; border: 0; border-radius: 6px;
    touch-action: none; }
  #ond-ctl button.on { background: #e8a33d; color: #111; }
  #ond-ctl button.stop { background: #5a1f1a; color: #f0d8d0; }
  #ond-ctl .oct { text-align: center; line-height: 1.6; }
  #ond-ctl a { color: #6b675f; font-size: 0.7em; text-align: center; }
  #ond-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #ond-kb { position: relative; flex: 1; }
  #ond-pads { display: none; grid-template-columns: repeat(16, 1fr); gap: 4px; flex: 0 0 38%; touch-action: none; }
  #ond-keys.pads #ond-pads { display: grid; }
  #ond-keys.tall #ond-pads { grid-template-columns: repeat(8, 1fr); flex-basis: 30%; }
  .op { background: #3a2a14; color: #e8a33d; border-radius: 6px; display: flex; align-items: center;
    justify-content: center; text-align: center; font-size: 0.75em; line-height: 1.1; overflow: hidden; }
  .op.down { background: #e8a33d; color: #111; }
  #ond-keys.tall { flex-direction: column; }
  #ond-keys.tall #ond-ctl { flex-direction: row; width: auto; height: calc(var(--ks) * 0.45); align-items: stretch; }
  #ond-keys.tall #ond-ctl .row { flex: 2; }
  #ond-keys.tall #ond-ctl .oct, #ond-keys.tall #ond-ctl a { flex: 1; align-self: center; }
  .ok { position: absolute; box-sizing: border-box; border-radius: 0 0 6px 6px; display: flex; align-items: flex-end;
    justify-content: center; padding-bottom: 6px; font-size: 0.85em; }
  .ok.w { top: 0; bottom: 0; background: #d8d3c8; border: 1px solid #111; color: #6b675f; }
  .ok.b { top: 0; height: 60%; background: #26241f; border: 1px solid #111; z-index: 1; color: #6b675f; }
  .ok.w.down { background: #e8a33d; color: #111; }
  .ok.b.down { background: #e8a33d; }
</style>
<div id="ond-keys">
  <div id="ond-ctl">
    <div class="row"><button id="ond-od">OCT -</button><button id="ond-ou">OCT +</button></div>
    <div class="oct" id="ond-oct">OCT 0</div>
    <div class="row"><button id="ond-pad">PADS</button><button id="ond-buf">BUF</button></div>
    <div class="row"><button id="ond-stop" class="stop">STOP</button></div>
    <a href="https://github.com/mortenlein/ond" target="_blank" rel="noopener">web __OND_WEB_V__ · GPL-3.0, source</a>
    <div class="oct" id="ond-load"></div>
  </div>
  <div id="ond-main"><div id="ond-pads"></div><div id="ond-kb"></div></div>
</div>
<script>
(function () {
  // an error, in full on the page (a phone has no console): the message, where, the version
  var dpfError = window.onerror;
  window.onerror = function (msg, src, line, col, err) {
    if (dpfError) dpfError(msg);
    var box = document.getElementById('error');
    if (box) {
      box.style.display = 'block';
      box.textContent = 'Ond web __OND_WEB_V__: ' + msg + ' (' + String(src).split('/').pop() + ':' + line + ':' + col + ') ' +
        String(err && err.stack || '').slice(0, 600);
    }
  };
  // BUF: the audio buffer (build_web.sh makes DPF's bridge take Module.ondBufferSize). Smaller: the keys answer
  // sooner; too small for the phone: crackles. Kept in this browser; a change reloads the page.
  var BUFS = [256, 512, 1024, 2048], buf = 0;
  try { buf = +localStorage.getItem('ond-buf') || 0; } catch (x) {}
  if (BUFS.indexOf(buf) < 0) buf = matchMedia('(pointer: coarse)').matches ? 512 : 1024;
  if (window.Module) Module.ondBufferSize = buf;
  var NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FIRST = 53, COUNT = 27;            // F3..G5, the FM-1's keys
  var root = document.getElementById('ond-keys'), kb = document.getElementById('ond-kb');
  var oct = 0, pads = false, keys = [], whites = [];
  // Brudd's breakers (firmware/src/punch.c PUNCH_NAME), held: the latest held plays, LAND brings the groove back
  var BREAKERS = ['LOOP 4', 'LOOP 8', 'LOOP 16', 'LOOP 32', 'STUTTER', 'REVERSE', 'STOP', 'HALF',
                  'LOW', 'HIGH', 'PHONE', 'CRUSH', 'ALIAS', 'GATE', 'ECHO', 'WOBBLE'];
  var held = {};                         // pointer id -> {key, msg}

  function send(st, d1, d2) {
    var f = window._ond_web_in || (window.Module && Module._ond_web_in);
    if (f) f(st, d1, d2);
  }
  function wake() {                      // browsers start audio only on a touch or click
    var wab = window.Module && Module.WebAudioBridge;
    if (wab && wab.audioContext && wab.audioContext.state !== 'running') wab.audioContext.resume();
  }

  // the keys: white ones side by side, black ones over their gaps
  for (var i = 0; i < COUNT; ++i) {
    var n = FIRST + i, black = NAMES[n % 12].length > 1;
    var el = document.createElement('div');
    el.className = 'ok ' + (black ? 'b' : 'w');
    el.dataset.i = i;
    keys.push({ el: el, i: i, black: black, white: black ? -1 : whites.length, down: 0 });
    if (!black) whites.push(i);
    kb.appendChild(el);
  }
  var ww = 100 / whites.length;
  keys.forEach(function (k) {
    if (!k.black) {
      k.el.style.left = (k.white * ww) + '%';
      k.el.style.width = ww + '%';
    } else {
      var left = keys[k.i - 1].white + 1; // the white key to its right starts here
      k.el.style.left = (left * ww - ww * 0.32) + '%';
      k.el.style.width = (ww * 0.64) + '%';
    }
  });
  function label() {
    keys.forEach(function (k) {
      var n = FIRST + k.i + 12 * oct;
      k.el.textContent = k.black ? '' : NAMES[n % 12] + (Math.floor(n / 12) - 1);
    });
    document.getElementById('ond-oct').textContent = 'OCT ' + (oct > 0 ? '+' : '') + oct;
    root.classList.toggle('pads', pads);
    document.getElementById('ond-pad').classList.toggle('on', pads);
  }
  label();

  function keyAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el && el.parentElement === kb ? keys[+el.dataset.i] : null;
  }
  function press(k) {                    // what this key sends now (kept: its release sends the matching off)
    var msg = [0x90, FIRST + k.i + 12 * oct, 0x80];
    send(msg[0], msg[1], 100);
    if (++k.down === 1) k.el.classList.add('down');
    return msg;
  }
  function release(h) {
    send(h.msg[2], h.msg[1], 0);
    if (--h.key.down === 0) h.key.el.classList.remove('down');
  }
  kb.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    wake();
    var k = keyAt(e.clientX, e.clientY);
    if (!k) return;
    try { kb.setPointerCapture(e.pointerId); } catch (x) {}   // (the finger leaving the keys still ends its note)
    held[e.pointerId] = { key: k, msg: press(k) };
  });
  kb.addEventListener('pointermove', function (e) {     // a finger sliding: key to key
    var h = held[e.pointerId];
    if (!h) return;
    var k = keyAt(e.clientX, e.clientY);
    if (!k || k === h.key) return;
    release(h);
    held[e.pointerId] = { key: k, msg: press(k) };
  });
  function up(e) {
    var h = held[e.pointerId];
    if (!h) return;
    release(h);
    delete held[e.pointerId];
  }
  kb.addEventListener('pointerup', up);
  kb.addEventListener('pointercancel', up);
  function tap(id, f) {
    document.getElementById(id).addEventListener('pointerdown', function (e) { e.preventDefault(); wake(); f(); label(); });
  }
  tap('ond-od', function () { oct = Math.max(-3, oct - 1); });
  tap('ond-ou', function () { oct = Math.min(3, oct + 1); });
  tap('ond-pad', function () { pads = !pads; });
  tap('ond-stop', function () {           // every sound off: the engine, and every key and pad let go here
    send(0xF3, 0, 0);
    held = {};
    padHeld = {};
    keys.forEach(function (k) { k.down = 0; k.el.classList.remove('down'); });
    Array.prototype.forEach.call(document.querySelectorAll('.op.down'), function (el) { el.classList.remove('down'); });
  });

  // the pads: down / up as the breaker's pad (several fingers: the latest held plays)
  var padEl = document.getElementById('ond-pads'), padHeld = {};
  BREAKERS.forEach(function (name, i) {
    var el = document.createElement('div');
    el.className = 'op';
    el.textContent = name;
    el.dataset.b = i;
    padEl.appendChild(el);
  });
  padEl.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    wake();
    var el = e.target.closest('.op');
    if (!el) return;
    try { padEl.setPointerCapture(e.pointerId); } catch (x) {}
    padHeld[e.pointerId] = el;
    el.classList.add('down');
    send(0xF1, +el.dataset.b, 100);
  });
  function padUp(e) {
    var el = padHeld[e.pointerId];
    if (!el) return;
    delete padHeld[e.pointerId];
    el.classList.remove('down');
    send(0xF2, +el.dataset.b, 0);
  }
  padEl.addEventListener('pointerup', padUp);
  padEl.addEventListener('pointercancel', padUp);
  tap('ond-buf', function () {
    var next = BUFS[(BUFS.indexOf(buf) + 1) % BUFS.length];
    try { localStorage.setItem('ond-buf', next); } catch (x) {}
    location.reload();
  });
  document.getElementById('ond-buf').textContent = 'BUF ' + buf;

  // the audio thread's load: how much of each buffer's time Ond took to fill it (over 100%: dropouts)
  var load = 0, rate = 48000;
  var watch = setInterval(function () {
    var wab = window.Module && Module.WebAudioBridge, p = wab && wab.processor;
    if (!p || !p.onaudioprocess || p.ondWatched) return;
    var run = p.onaudioprocess;
    rate = wab.audioContext.sampleRate;
    p.onaudioprocess = function (e) {
      var t = performance.now();
      run(e);
      var used = (performance.now() - t) / (e.outputBuffer.length / rate * 1000);
      load = load * 0.9 + used * 0.1;
    };
    p.ondWatched = true;
  }, 250);
  setInterval(function () {
    document.getElementById('ond-load').textContent =
      Math.round(buf / rate * 1000) + ' MS · LOAD ' + Math.round(load * 100) + '%';
  }, 500);

  // touch on the screen: one finger is the mouse, nothing else. DPF's own touch handling (pugl's wasm.c) listens on
  // the whole window, takes the first finger anywhere (a finger on the keys too) as the click, and holds each tap
  // up to 2 s for a long press: taps landed elsewhere, knobs jumped. So no touch event reaches it (nor the mouse
  // events a browser makes up after a tap); the screen gets mouse events from the first finger on it only.
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      e.stopImmediatePropagation();
      if (!(e.target && e.target.closest && e.target.closest('a'))) e.preventDefault();
    }, { capture: true, passive: false });
  });
  var screenFinger = null;
  function toScreen(type, e, target) {
    target.dispatchEvent(new MouseEvent(type, { clientX: e.clientX, clientY: e.clientY, screenX: e.screenX,
      screenY: e.screenY, button: 0, buttons: type === 'mouseup' ? 0 : 1, bubbles: true, cancelable: true }));
  }
  document.addEventListener('pointerdown', function (e) {
    var c = document.getElementById('canvas');
    if (e.pointerType === 'mouse' || e.target !== c || screenFinger !== null) return;
    screenFinger = e.pointerId;
    try { c.setPointerCapture(e.pointerId); } catch (x) {}
    wake();
    toScreen('mousemove', e, c);
    toScreen('mousedown', e, c);
  }, true);
  document.addEventListener('pointermove', function (e) {
    if (e.pointerId === screenFinger) toScreen('mousemove', e, document.getElementById('canvas'));
  }, true);
  function screenUp(e) {
    if (e.pointerId !== screenFinger) return;
    screenFinger = null;
    toScreen('mouseup', e, document.getElementById('canvas'));
  }
  document.addEventListener('pointerup', screenUp, true);
  document.addEventListener('pointercancel', screenUp, true);

  // the fit: the screen (1000 x 700) above the keys. On a phone the page is laid out wide enough for both and the
  // browser scales it to the glass; on a computer the window is what it is.
  var meta = document.querySelector('meta[name=viewport]'), last = '';
  function fit() {
    var touch = matchMedia('(pointer: coarse)').matches;
    var r = innerWidth / innerHeight, k;
    if (touch) {
      var w = r > 1 ? Math.max(1010, 900 * r) : 1010;
      var h = w / r;
      k = r > 1 ? h - 705 : Math.max(220, Math.min(h - 720, h * 0.42));
      var c = 'width=' + Math.round(w) + ', user-scalable=no';
      if (c !== last) { meta.setAttribute('content', c); last = c; }
    } else {
      k = Math.max(150, Math.min(220, innerHeight - 705));
    }
    document.documentElement.style.setProperty('--kb', Math.round(k) + 'px');
    document.documentElement.style.setProperty('--ks', Math.round(Math.min(k, 200)) + 'px');
    root.classList.toggle('tall', touch && r <= 1);
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function () { last = ''; meta.setAttribute('content', 'width=device-width'); setTimeout(fit, 300); });
})();
</script>
